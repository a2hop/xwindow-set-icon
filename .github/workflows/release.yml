name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxmu-dev libgd-dev libglib2.0-dev libgtk-3-dev pkg-config
    
    - name: Build CLI
      run: |
        cd cli
        chmod +x build.sh
        ./build.sh
    
    - name: Build GUI
      run: |
        cd gui
        chmod +x build.sh
        ./build.sh
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/xwindow-icon-set
          build/xwindow-icon-set-gui
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
