name: Build and Release

on:
  release:
    types: [created]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxmu-dev libgd-dev libglib2.0-dev pkg-config
    
    - name: Build CLI
      run: |
        cd cli
        chmod +x build.sh
        ./build.sh
    
    - name: Create tarball
      run: |
        mkdir -p release
        cp build/xwindow-icon-set release/
        cp README.md release/
        tar -czf xwindow-icon-set-linux-x64.tar.gz -C release .
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./xwindow-icon-set-linux-x64.tar.gz
        asset_name: xwindow-icon-set-linux-x64.tar.gz
        asset_content_type: application/gzip
