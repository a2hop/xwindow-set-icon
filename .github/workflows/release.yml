name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxmu-dev libgd-dev libglib2.0-dev pkg-config
    
    - name: Build CLI
      run: |
        cd cli
        chmod +x build.sh
        ./build.sh
    
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: build/xwindow-icon-set
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
